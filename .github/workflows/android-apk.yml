name: APK Android de test

# Une étape terminée = fichier VERSION modifié : l'APK est publié dans les
# Releases du dépôt (tag vX.Y.Z créé automatiquement).
# Lancement manuel possible depuis l'onglet Actions (l'APK est alors dans les artefacts du run).
on:
  push:
    paths: ["VERSION"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7"
  PROJECT_DIR: "."

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Godot et les modèles d'export Android
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates/* "$tpl"/
          ls -la "$tpl"

      - name: Importer le projet et lancer les tests
        run: |
          godot --headless --path "$PROJECT_DIR" --import || true
          godot --headless --path "$PROJECT_DIR" --script res://tests/run_tests.gd -- --sims=50

      - name: Configurer la signature et le SDK Android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          # Clé de signature FIXE (secret ANDROID_KEYSTORE_B64) : Android n'accepte une mise à jour que si
          # l'APK est signé avec la même clé. Sans elle, il faudrait désinstaller et la sauvegarde serait perdue.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/debug.keystore"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_B64 absent : clé temporaire, mise à jour impossible sans désinstaller."
            keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p "$HOME/.config/godot"
          minor=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          for v in 4 "$minor"; do
          cat > "$HOME/.config/godot/editor_settings-${v}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          cat "$HOME/.config/godot/editor_settings-${minor}.tres"

      - name: Numéroter la version
        run: |
          name="$(tr -d '[:space:]' < "$PROJECT_DIR/VERSION")"
          [[ "$GITHUB_EVENT_NAME" == "push" ]] || name="${name}-dev${GITHUB_RUN_NUMBER}"
          echo "APP_VERSION=${name}" >> "$GITHUB_ENV"
          sed -i "s/^version\/name=.*/version\/name=\"${name}\"/; s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" \
            "$PROJECT_DIR/export_presets.cfg"
          echo "APK_NAME=t99-${name}.apk" >> "$GITHUB_ENV"

      - name: Exporter l'APK
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          mkdir -p build && touch build/.gdignore
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$GITHUB_WORKSPACE/build/$APK_NAME"
          test -s "build/$APK_NAME"
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: build/${{ env.APK_NAME }}

      - name: Publier la Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: T99 v${{ env.APP_VERSION }}
          files: build/${{ env.APK_NAME }}
          prerelease: true
          body: |
            APK de test (debug) de T99, version ${{ env.APP_VERSION }}.
            Sur Android : télécharger le fichier .apk, l'ouvrir, autoriser l'installation depuis cette source.

      - name: Release « dernière version » (lien fixe pour le téléphone)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "build/$APK_NAME" build/t99-derniere.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest build/t99-derniere.apk \
            --title "APK – dernière version (v${APP_VERSION})" \
            --notes "Toujours la dernière version. Compilé depuis ${GITHUB_SHA::7}." --prerelease
